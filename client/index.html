<!doctype html>
<html lang="en" data-theme="ocean">

<head>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TypeGiggle",
      "url": "https://typegiggle.com",
      "description": "Test your WPM and accuracy with TypeGiggle. Free typing test with custom themes, quote mode, zen mode, and global leaderboards.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://typegiggle.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
  
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/typegiggle_logo.png" />

  <!-- Primary Meta Tags -->
  <title>TypeGiggle - Fun Typing Test & Speed Tracker</title>
  <meta name="title" content="TypeGiggle - Fun Typing Test & Speed Tracker" />
  <meta name="description" content="Test your typing speed, track your WPM history, climb the global leaderboard, and enjoy custom themes. Free, fun, and ad-light." />

  <!-- Open Graph / Facebook / Discord -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://typegiggle.com/" />
  <meta property="og:title" content="TypeGiggle - Fun Typing Test & Speed Tracker" />
  <meta property="og:description" content="Test your typing speed, track your WPM history, climb the global leaderboard, and enjoy custom themes. Free, fun, and ad-light." />
  <meta property="og:image" content="https://typegiggle.com/typegiggle_logo.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://typegiggle.com/" />
  <meta property="twitter:title" content="TypeGiggle - Fun Typing Test & Speed Tracker" />
  <meta property="twitter:description" content="Test your typing speed, track your WPM history, climb the global leaderboard, and enjoy custom themes. Free, fun, and ad-light." />
  <meta property="twitter:image" content="https://typegiggle.com/typegiggle_logo.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
