<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.05" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Glow Effect behind text -->
  <circle cx="600" cy="315" r="250" fill="#38bdf8" opacity="0.1" filter="blur(100px)" />

  <!-- Logo / Brand Name -->
  <text x="600" y="250" font-family="'Outfit', sans-serif" font-size="120" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">type</text>
  <text x="600" y="370" font-family="'Outfit', sans-serif" font-size="120" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="-2">giggle</text>

  <!-- Tagline -->
  <text x="600" y="450" font-family="'Outfit', sans-serif" font-size="32" font-weight="400" fill="#94a3b8" text-anchor="middle">Free Typing Speed Test &amp; WPM Tracker</text>

  <!-- Subtext / Features -->
  <text x="600" y="510" font-family="'Fira Code', monospace" font-size="20" fill="#64748b" text-anchor="middle">Custom Themes • Leaderboards • Real-time Stats</text>
</svg>